manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: zmk-next
      url-base: https://github.com/rleyvasal/zmk-next/releases/tag/v0.2.5
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.2
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: main
      path: modules/helpers
    - name: zmk-next
      remote: zmk-next
      revision: v0.2
  self:
    path: config
